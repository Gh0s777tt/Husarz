apiVersion: v1
kind: Service
metadata:
  name: husarz-api
  namespace: husarz
  labels:
    app.kubernetes.io/name: husarz-api
spec:
  type: ClusterIP # brak ekspozycji poza klaster — dostęp wyłącznie przez Ingress
  selector:
    app.kubernetes.io/name: husarz-api
  ports:
    - name: http
      port: 8000
      targetPort: http
