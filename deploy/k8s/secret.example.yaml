# ============================================================================
# secret.example.yaml — SZABLON. NIE commituj prawdziwego Secretu.
# ----------------------------------------------------------------------------
# W produkcji dostarczaj sekrety przez External Secrets Operator / Sealed Secrets
# / Vault Agent Injector — nie przez zwykły manifest. Ten plik pokazuje jedynie
# oczekiwane klucze. `stringData` z placeholderami (CHANGE_ME) — do zastąpienia.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: husarz-secrets
  namespace: husarz
type: Opaque
stringData:
  # Token API (Bearer). Wygeneruj: openssl rand -hex 32
  HUSARZ_API_TOKEN: CHANGE_ME
  HUSARZ_PG_PASSWORD: CHANGE_ME
  HUSARZ_MINIO_PASSWORD: CHANGE_ME
