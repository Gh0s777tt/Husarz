# Kustomize — spina manifesty Husarza. Zastosowanie:
#   kubectl apply -k deploy/k8s
# UWAGA: secret.example.yaml jest CELOWO pominięty — dostarcz sekrety osobno
# (External Secrets / Sealed Secrets / Vault). Zmień host w ingress.yaml na własny.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: husarz

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow.yaml

# `commonLabels` jest przestarzałe I wstrzykuje etykiety do SELEKTORÓW, a selektor
# Deploymentu jest NIEMODYFIKOWALNY po utworzeniu — każda przyszła zmiana tego pola
# zablokowałaby aktualizację istniejącego wdrożenia (`field is immutable`). Nowa składnia
# z `includeSelectors: false` dokłada etykietę wyłącznie do metadanych.
labels:
  - pairs:
      app.kubernetes.io/part-of: husarz
    includeSelectors: false
