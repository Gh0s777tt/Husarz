apiVersion: apps/v1
kind: Deployment
metadata:
  name: husarz-api
  namespace: husarz
  labels:
    app.kubernetes.io/name: husarz-api
    app.kubernetes.io/part-of: husarz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: husarz-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: husarz-api
        app.kubernetes.io/part-of: husarz
    spec:
      # Hardening na poziomie Poda (spójne z Pod Security "restricted").
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: api
          image: husarz-api:latest
          imagePullPolicy: IfNotPresent
          args: ["up", "--profile", "prod", "--host", "0.0.0.0"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: husarz-config
            - secretRef:
                name: husarz-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # rootfs tylko-do-odczytu → katalogi zapisywalne jako emptyDir.
            - name: audit
              mountPath: /app/audit
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
