apiVersion: apps/v1
kind: Deployment
metadata:
  name: husarz-api
  namespace: husarz
  labels:
    app.kubernetes.io/name: husarz-api
    app.kubernetes.io/part-of: husarz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: husarz-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: husarz-api
        app.kubernetes.io/part-of: husarz
    spec:
      # Hardening na poziomie Poda (spójne z Pod Security "restricted").
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: api
          # Obraz PRZYPIĘTY do wersji, nie `latest`. `latest` w parze
          # z `imagePullPolicy: IfNotPresent` jest najgorszym z możliwych połączeń: węzeł
          # trzyma to, co akurat pobrał jako pierwsze, więc wdrożenie przestaje być
          # odtwarzalne i nie daje się zaktualizować bez ręcznego czyszczenia cache'u.
          # Podmiana tagu bez edycji tego pliku:
          #   kubectl kustomize --load-restrictor=... | ...
          #   albo: (cd deploy/k8s && kustomize edit set image husarz-api=husarz-api:X.Y.Z)
          image: husarz-api:0.14.0
          imagePullPolicy: IfNotPresent
          args: ["up", "--profile", "prod", "--host", "0.0.0.0"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: husarz-config
            - secretRef:
                name: husarz-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # rootfs tylko-do-odczytu → katalogi zapisywalne jako emptyDir.
            - name: audit
              mountPath: /app/audit
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
