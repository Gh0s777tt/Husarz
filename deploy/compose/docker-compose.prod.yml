# ============================================================================
# docker-compose.prod.yml — nakładka profilu PROD (nałóż na base).
# ----------------------------------------------------------------------------
#   docker compose -f deploy/compose/docker-compose.base.yml \
#                  -f deploy/compose/docker-compose.prod.yml up -d
#
# Terminacja TLS na proxy brzegowym (Caddy) dla ${HUSARZ_PUBLIC_HOST}. Tylko proxy
# ma sieć brzegową z dostępem do WAN (ACME); API pozostaje w sieci wewnętrznej.
# API wymaga tokenu (bez --allow-insecure). Zob. docs/DEPLOY.md.
# ============================================================================

services:
  api:
    command: ["up", "--profile", "prod", "--host", "0.0.0.0"]
    # Bez publikacji portu na hosta — ruch wyłącznie przez proxy (sieć wewnętrzna).
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    # Publiczny HTTPS. Host publiczny sterowany zmienną (domyślnie husarzai.pl).
    environment:
      HUSARZ_PUBLIC_HOST: ${HUSARZ_PUBLIC_HOST:-husarzai.pl}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - husarz_caddy_data:/data
      - husarz_caddy_config:/config
    networks:
      - husarz_internal # dostęp do api
      - husarz_edge # dostęp do WAN (ACME/Let's Encrypt)
    depends_on:
      - api
    restart: unless-stopped

networks:
  # Sieć brzegowa z trasą do WAN — WYŁĄCZNIE dla proxy (nie dla api/DB).
  husarz_edge:
    driver: bridge

volumes:
  husarz_caddy_data:
  husarz_caddy_config:
