# ============================================================================
# docker-compose.airgap.yml — nakładka profilu AIRGAP (nałóż na base).
# ----------------------------------------------------------------------------
#   docker compose -f deploy/compose/docker-compose.base.yml \
#                  -f deploy/compose/docker-compose.airgap.yml up -d
#
# BRAK DOSTĘPU DO WAN: żadnego proxy/ACME, wszystkie sieci wewnętrzne (z base),
# dostęp do API wyłącznie przez loopback HOSTA. Profil airgap w configu wymusza
# deny-all egress, brak sieci sandboxa i lokalne endpointy modeli (walidacja
# krzyżowa schematu). Token API nadal wymagany. Zob. docs/DEPLOY.md.
# ============================================================================

services:
  api:
    command: ["up", "--profile", "airgap", "--host", "0.0.0.0"]
    # Dostęp tylko z loopbacku hosta — brak ekspozycji do LAN/WAN.
    ports:
      - "127.0.0.1:8000:8000"
    # W airgapie obraz musi już istnieć lokalnie (brak pull z rejestru w runtime).
    pull_policy: never
    restart: unless-stopped

  # Usługi danych również NIE mogą próbować pullować w airgapie — brak obrazu = jawny
  # błąd, nie ciche sięganie do rejestru (którego i tak nie ma trasy WAN).
  postgres:
    pull_policy: never
  redis:
    pull_policy: never
  minio:
    pull_policy: never
  vault:
    pull_policy: never

# ----------------------------------------------------------------------------
# Sieć: nadpisanie `internal` z base — INACZEJ PROFIL NIE DZIAŁA.
# ----------------------------------------------------------------------------
# Docker CICHO wyłącza publikowanie portów dla sieci `internal: true`. Deklaracja
# `ports: "127.0.0.1:8000:8000"` wyżej była wtedy MARTWA: kontener wstawał jako `healthy`,
# ale `curl http://127.0.0.1:8000/api/health` z hosta nie łączył się w ogóle (Docker
# raportował „8000/tcp" zamiast „127.0.0.1:8000->8000/tcp"). Profil obiecywał dostęp
# przez loopback hosta i tej obietnicy nie spełniał.
#
# Dlaczego to NIE jest osłabienie airgapu:
#   1. Na maszynie faktycznie odciętej nie ma trasy do WAN — nie ma czego blokować.
#   2. Profil `airgap` w configu wymusza przy STARCIE: deny-all egress, pustą allowlistę,
#      brak sieci w sandboxie i wyłącznie lokalne endpointy modeli (walidacja krzyżowa
#      w husarz.config.schema). To bramka aplikacyjna, niezależna od sieci Dockera.
#   3. Ruch wychodzący narzędzi przechodzi dodatkowo przez pinowanie IP (ADR-0020).
# Profil `prod` zostaje na sieci `internal` z base — tam API portów NIE publikuje,
# bo jedynym wejściem jest Caddy w sieci brzegowej, więc sprzeczności nie ma.
networks:
  husarz_internal:
    internal: false
