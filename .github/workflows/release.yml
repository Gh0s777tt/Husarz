# Buduje pobieralny launcher (husarz-app) dla Windows/Linux/macOS.
# Artefakty dostępne w zakładce Actions; dla tagu v* dołączane do jednego GitHub Release.
name: Release launcher

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/husarz-app.exe
            asset: husarz-app-windows.exe
          - os: ubuntu-latest
            built: dist/husarz-app
            asset: husarz-app-linux
          - os: macos-latest
            built: dist/husarz-app
            asset: husarz-app-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalacja pakietu + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"

      - name: Budowa binarki
        run: pyinstaller packaging/husarz.spec --noconfirm

      - name: Zmiana nazwy binarki (unikalna per-OS)
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - name: Publikacja artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Osobny, sekwencyjny job Release: jedno wywołanie gh-release z WSZYSTKIMI binarkami
  # (unikalne nazwy per-OS) — koniec kolizji nazw i wyścigu przy tworzeniu Release.
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobranie artefaktów
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Utworzenie/aktualizacja Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
