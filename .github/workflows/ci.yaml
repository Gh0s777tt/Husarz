# CI Husarza — lint, typy, testy, skan sekretów.
# Zielone CI jest warunkiem scalenia (definicja "ukończone").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + typy + testy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `docs` jest tu potrzebne dla kroku `mkdocs build --strict`: MkDocs mieszka w extra
      # `docs`, nie `dev`. Bez tego nowy krok wywróciłby pipeline na braku polecenia —
      # sprawdzone przed dopisaniem, a nie po.
      - name: Instalacja zależności (dev + docs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff (lint)
        run: ruff check .

      # `scripts` NIE jest tu ozdobą: CLAUDE.md wymienia `black --check src tests scripts`
      # jako bramkę, a CI sprawdzało tylko dwa pierwsze katalogi. Źle sformatowany skrypt
      # operatora przechodził więc przez pipeline, choć lokalna bramka by go zatrzymała.
      - name: Black (format check)
        run: black --check src tests scripts

      - name: Mypy (typy)
        run: mypy

      - name: Pytest (testy)
        run: pytest -q

      # Bramka jakości Husarza (Etap 16): weryfikatory deterministyczne — routing agentów
      # i bramka narzędziowa. Nie wołają modelu ani sieci, więc działają w CI jak zwykły
      # test; kod wyjścia 1 przy niezdanym przypadku zatrzymuje pipeline.
      - name: Husarz eval (bramka jakości)
        run: python -m husarz.launcher.cli eval --config ./config --prompts ./prompts

      # Dokumentacja jest w tym projekcie bramką, nie dodatkiem: `--strict` wywraca się na
      # martwym odnośniku, czyli na rozjeździe dokumentacji z kodem. Krok był wymieniony
      # w CLAUDE.md, ale w pipelinie go NIE BYŁO — martwy odnośnik przechodził przez CI.
      - name: MkDocs (build --strict)
        run: python -m mkdocs build --strict

  gitleaks:
    name: Skan sekretów (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sca:
    name: SCA (pip-audit — znane podatności zależności)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalacja pakietu + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      - name: pip-audit
        run: pip-audit --strict --progress-spinner off

  docker:
    name: Lint + build obrazów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile rdzenia)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Hadolint (obraz sandboxa)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/husarz-sandbox.Dockerfile
      - name: Build obrazu rdzenia (bez push)
        run: docker build -t husarz-api:ci .
