# CI Husarza — lint, typy, testy, skan sekretów.
# Zielone CI jest warunkiem scalenia (definicja "ukończone").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + typy + testy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalacja zależności (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check src tests

      - name: Mypy (typy)
        run: mypy

      - name: Pytest (testy)
        run: pytest -q

  gitleaks:
    name: Skan sekretów (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sca:
    name: SCA (pip-audit — znane podatności zależności)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalacja pakietu + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      - name: pip-audit
        run: pip-audit --strict --progress-spinner off

  docker:
    name: Lint + build obrazów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile rdzenia)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Hadolint (obraz sandboxa)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/husarz-sandbox.Dockerfile
      - name: Build obrazu rdzenia (bez push)
        run: docker build -t husarz-api:ci .
