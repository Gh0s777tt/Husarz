# ============================================================================
# docker-compose.yaml — profil DEV (samowystarczalny, uruchom w katalogu repo).
# ----------------------------------------------------------------------------
#   docker compose up --build
#
# Uruchamia sam rdzeń (API + konsola) na loopbacku HOSTA (127.0.0.1:8000).
# Wewnątrz kontenera API nasłuchuje na 0.0.0.0 (wymóg konteneryzacji), ale port
# jest publikowany WYŁĄCZNIE na 127.0.0.1 — stąd świadome --allow-insecure.
# Ciężkie usługi (postgres/pgvector, redis, minio, vault) oraz TLS/ingress są w
# profilach prod/airgap: deploy/compose/. Zob. docs/DEPLOY.md.
# ============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: husarz-api:dev
    # Publikacja tylko na loopback hosta — API nieosiągalne z sieci LAN/WAN.
    ports:
      - "127.0.0.1:8000:8000"
    command: ["up", "--profile", "dev", "--host", "0.0.0.0", "--allow-insecure"]
    # Hardening kontenera (jak w prod): non-root, rootfs RO, brak eskalacji, zrzut caps.
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    environment:
      HUSARZ_CONFIG_DIR: /app/config
    volumes:
      # Konfiguracja i prompty montowane tylko-do-odczytu (edycja bez rebuildu).
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # Audyt zapisywany na wolumenie nazwanym (trwałość między restartami).
      - husarz_audit:/app/audit
    networks:
      - husarz_internal
    restart: unless-stopped

networks:
  husarz_internal:
    driver: bridge
    # UWAGA: `internal: true` w Dockerze CICHO WYŁĄCZA publikowanie portów — kontener staje
    # się nieosiągalny z hosta, a deklaracja `ports` przestaje cokolwiek znaczyć (Docker
    # raportuje wtedy „8000/tcp" zamiast „127.0.0.1:8000->8000/tcp"). Profil dev nie ma
    # proxy, które mogłoby to mostkować (w prod robi to Caddy w sieci `husarz_edge`), więc
    # sieć MUSI być zwykła — inaczej `docker compose up` daje kontener, do którego nie da
    # się wejść. Blokuje to również dostęp do modelu na hoście (Ollama), czyli czat.
    #
    # Egress jest tu egzekwowany WARSTWĄ APLIKACJI: `security.egress.default_policy: deny`
    # + allowlista + pinowanie IP (ADR-0020). Wymuszenie sieciowe należy do produkcji —
    # k8s NetworkPolicy deny-all (deploy/k8s/) oraz profil airgap bez trasy do WAN.
    internal: false

volumes:
  husarz_audit:
