# ============================================================================
# config/plugins/example-mcp.yaml — przykładowy konektor wtyczki (serwer MCP).
# ----------------------------------------------------------------------------
# Wtyczka = zewnętrzny serwer narzędzi MCP, z którym Husarz łączy się przez HTTP
# JSON-RPC. Domyślnie WYŁĄCZONA (enabled: false) — deny-by-default. Nowy konektor
# = nowy plik w config/plugins/, BEZ zmian w rdzeniu.
#
# Bezpieczeństwo (patrz docs/WTYCZKI.md, docs/BEZPIECZENSTWO.md):
# - endpoint lokalny (loopback) jest dozwolony; host publiczny wymaga https oraz
#   wpisu w security.egress.allowlist (deny-all). Adresy wewnętrzne/metadanych
#   (169.254.169.254, 10.x, 192.168.x, ::ffff:… itd.) są TWARDO blokowane (SSRF).
# - token to WYŁĄCZNIE referencja do sekretu (env:/file:/vault:/sops:), nigdy sama
#   wartość. Rozwiązywany jest dopiero przy operacji, nie jest logowany.
# ============================================================================

name: example-mcp
transport: http
description: Przykładowy lokalny serwer narzędzi MCP (wyłączony).
enabled: false

# URL serwera MCP. Loopback (lokalny) — ruch nie opuszcza hosta.
endpoint: http://127.0.0.1:8808/mcp

# Token (opcjonalny) jako REFERENCJA do sekretu — nie sama wartość.
token_ref: env:HUSARZ_MCP_TOKEN

timeout_seconds: 30
max_output_bytes: 1000000     # twardy limit odpowiedzi (ochrona przed OOM)

# --- Wywołanie zdalnych narzędzi (tools/call) — deny-by-default, ADR-0019 ----
# Odkrywanie (tools/list) działa bez poniższych; WYWOŁANIE wymaga jawnego opt-in:
allow_call: false             # master-switch: bez tego 'call' jest zawsze odmawiane
call_allowlist: []            # jawna enumeracja dozwolonych zdalnych narzędzi (pusta = nic)
max_call_bytes: 64000         # cap zserializowanych params (name+arguments) PRZED egress
# Aby wołać narzędzia: ustaw allow_call: true i wypełnij call_allowlist, np.:
#   allow_call: true
#   call_allowlist: [search, fetch_doc]
# oraz dodaj narzędzie kind=plugin wiążące ten konektor (config/tools/example-plugin.yaml).
