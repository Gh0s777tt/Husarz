# ============================================================================
# config/security.yaml — bezpieczeństwo i prywatność (sekcja "security").
# ----------------------------------------------------------------------------
# Twarde wymagania: deny-all egress, sandbox bez sieci, audit log niemodyfikowalny,
# szyfrowanie at-rest, mTLS, OIDC+RBAC, filtry anty-prompt-injection.
#
# Model dwuwarstwowy egress: globalna polityka (tu) jest DENY-ALL; narzędzia
# deklarują potrzebne domeny w config/tools/*.yaml. Aby faktycznie zezwolić na
# ruch, operator dodaje domenę do egress.allowlist poniżej.
# ============================================================================

egress:
  # deny = blokuj wszystko poza allowlistą (domyślne, suwerenność danych).
  default_policy: deny
  # Pusta = pełny deny-all. Dodawaj domeny świadomie (np. "docs.python.org").
  allowlist: []

sandbox:
  engine: docker+gvisor      # none | docker | docker+gvisor | firecracker
  network: false             # brak sieci w sandboxie domyślnie
  cpu_limit: "1"
  memory_limit: 512m
  timeout_seconds: 60
  workspace_only: true       # dostęp wyłącznie do katalogu workspace
  command_allowlist: []      # np. ["python", "pytest", "git"] — ustawiane per profil
  path_allowlist: []         # dodatkowe ścieżki tylko-do-odczytu
  image: husarz-sandbox:latest   # obraz kontenera narzędzi (budowany lokalnie, Etap 6)
  runtime_class: runsc           # gVisor; null dla zwykłego Dockera
  run_as_user: "1000:1000"       # non-root w kontenerze
  pids_limit: 512                # limit procesów (ochrona przed fork-bombą)
  read_only_rootfs: true         # rootfs tylko-do-odczytu (zapis tylko do /tmp i workspace)

mtls:
  enabled: false             # włącz w prod; materiały przez sekrety, nie w repo
  ca_cert_ref: null
  cert_ref: null
  key_ref: null

auth:
  oidc_enabled: false        # włącz w prod (pełny przepływ tożsamości — Etap 6)
  issuer: null
  client_id: null
  roles: [admin, operator, viewer]
  # Token API (Bearer) dla REST API/konsoli. Podaj REFERENCJĘ do sekretu (nie sam
  # token!): "env:HUSARZ_API_TOKEN" lub "file:api_token". Gdy null — uwierzytelnianie
  # wyłączone (dozwolone WYŁĄCZNIE na loopbacku; launcher wymusza token dla 0.0.0.0).
  api_token_ref: null
  api_role: operator         # rola przypisana ważnemu tokenowi (RBAC)
  # --- Konta użytkowników (logowanie/rejestracja, sesje, limity tokenów) ---
  # Aktywne, gdy ustawisz accounts_path LUB seed_admin_username LUB allow_registration.
  allow_registration: false  # false = „dla wybranych" (konta zakłada admin)
  default_user_role: operator
  default_token_quota: null   # null = bez limitu (tryb suwerenny); liczba = limit per konto
  session_ttl_minutes: 720    # ważność sesji (12 h)
  accounts_path: null         # np. ./data/accounts.json (trwałość); null = tylko w pamięci
  # Seed administratora przy pustym magazynie — hasło z REFERENCJI do sekretu:
  seed_admin_username: null
  seed_admin_password_ref: null  # np. "env:HUSARZ_ADMIN_PASSWORD"

audit:
  enabled: true
  path: ./audit/audit.log
  immutable: true
  hash_chain: true           # łańcuch skrótów (wykrywanie manipulacji)

encryption:
  at_rest: true
  algorithm: AES-256-GCM

# Filtry I/O i izolacja treści niezaufanych (anty-prompt-injection).
prompt_injection_filters: true
