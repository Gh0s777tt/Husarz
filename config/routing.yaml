# ============================================================================
# config/routing.yaml — router modeli (sekcja "routing").
# ----------------------------------------------------------------------------
# Dobór modelu po tagach/capabilities + domyślne modele per agent + fallbacki.
# Zmiana modelu agenta = edycja tego pliku, bez zmian w kodzie.
# ============================================================================

# Strategia doboru. Działają WSZYSTKIE trzy (Etap 18h):
#
#   tags     — kolejność rejestru (domyślna, zachowanie dotychczasowe),
#   cost     — rosnąco wg `cost_per_1m_input + cost_per_1m_output`,
#   latency  — rosnąco wg `latency_p50_ms`.
#
# UWAGA na zakres: strategia porządkuje WYŁĄCZNIE pulę modeli dopasowanych po tagach.
# NIE rusza modelu wskazanego wprost, przypisań z `agent_models` ani kolejności w
# `rules[].prefer` — to są jawne decyzje operatora i mają obowiązywać.
#
# `cost` i `latency` WYMAGAJĄ danych: przy ich ustawieniu każdy włączony model z tagami musi
# mieć odpowiednie pola w `config/models.yaml`, inaczej start się nie powiedzie. Zostawiamy
# `tags`, bo dostarczona konfiguracja nie zawiera zmierzonych wartości — a wpisanie
# zmyślonych byłoby gorsze niż ich brak.
strategy: tags

# Wyłącznik bezpiecznikowy (Etap 18j). Model, który przed sekundą przekroczył limit czasu,
# był przy następnym żądaniu NADAL pierwszym kandydatem — każde kolejne żądanie płaciło więc
# pełny limit czasu, zanim spadło na fallback. Przy padniętym modelu głównym cała platforma
# zwalniała o tę wartość przy każdym zapytaniu.
#
# Model po `failures_to_open` KOLEJNYCH awariach trafia na KONIEC listy kandydatów na
# `cooldown_seconds`. Odsunięcie, nie wykluczenie: gdyby padło wszystko, wykluczanie
# zostawiłoby pustą listę i twardą odmowę zamiast próby, która mogłaby się powieść.
#
# Awarią jest WYŁĄCZNIE błąd realnego wywołania (limit czasu, brak połączenia, błąd silnika).
# Pominięcia wynikające z właściwości ŻĄDANIA — brak wizji przy obrazie, prompt poza oknem
# kontekstu, blokada egress — nie liczą się: model pominięty, bo prompt był za długi, jest
# w pełni zdrowy.
#
# Licznik jest KOLEJNYCH awarii: pojedynczy sukces zeruje go w całości. Wyłącznik ma łapać
# awarię trwającą TERAZ, a nie prowadzić statystykę.
#
# `cooldown_seconds: null` wyłącza mechanizm i przywraca zachowanie sprzed Etapu 18j.
health:
  failures_to_open: 3
  cooldown_seconds: 30

# Domyślny model per agent (nazwa agenta -> id modelu z registry, lub "auto").
agent_models:
  husarz: glm-main
  bielik: bielik
  kopijnik: hermes
  zwiadowca: hermes
  puszkarz: hermes
  kanclerz: glm-main
  chorazy: hermes

# Reguły: dopasuj po wymaganych tagach, preferuj wskazane modele (kolejność = priorytet).
rules:
  - match_tags: [polish]
    prefer: [bielik, glm-main]
  - match_tags: [code]
    prefer: [glm-main, hermes]
  - match_tags: [function-calling]
    prefer: [hermes, glm-main]
  - match_tags: [reasoning]
    prefer: [glm-main]

# Kontrola kosztów i limitów (twarde limity egzekwowane przez router w Etapie 1).
#
# UWAGA na `max_tokens_per_request` — to nie jest zwykły sufit, tylko REZERWA. Router
# odkłada tę liczbę tokenów na odpowiedź, sprawdzając, czy prompt zmieści się w oknie
# kontekstu modelu (`husarz.router.budget`). Limit równy oknu zabiera je więc w całości
# i NIE MIEŚCI SIĘ ŻADEN prompt, nawet jednowyrazowy.
#
# Stało tu wcześniej 8192, dokładnie tyle, ile wynosi `context_length` modeli
# `husarz-local` i `husarz-vision` — przez co domyślny model czatu był NIEUŻYWALNY.
# Wyglądało to niewinnie: silnik odpowiadał, `husarz doctor` meldował OK, a każde żądanie
# kończyło się „prompt nie mieści się w oknie kontekstu". Wykryło to dopiero uruchomienie
# czatu na żywo; od Etapu 18n taką parę wartości odrzuca walidacja krzyżowa.
#
# 2048 to hojny sufit na odpowiedź czatu (kilka ekranów tekstu), zostawiający 6144 tokeny
# na prompt przy oknie 8192.
cost_controls:
  max_tokens_per_request: 2048
  max_requests_per_minute: 120

# Włącz łańcuchy fallback zdefiniowane w models.yaml.
fallbacks_enabled: true
