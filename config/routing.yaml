# ============================================================================
# config/routing.yaml — router modeli (sekcja "routing").
# ----------------------------------------------------------------------------
# Dobór modelu po tagach/capabilities + domyślne modele per agent + fallbacki.
# Zmiana modelu agenta = edycja tego pliku, bez zmian w kodzie.
# ============================================================================

# Strategia doboru. Działają WSZYSTKIE trzy (Etap 18h):
#
#   tags     — kolejność rejestru (domyślna, zachowanie dotychczasowe),
#   cost     — rosnąco wg `cost_per_1m_input + cost_per_1m_output`,
#   latency  — rosnąco wg `latency_p50_ms`.
#
# UWAGA na zakres: strategia porządkuje WYŁĄCZNIE pulę modeli dopasowanych po tagach.
# NIE rusza modelu wskazanego wprost, przypisań z `agent_models` ani kolejności w
# `rules[].prefer` — to są jawne decyzje operatora i mają obowiązywać.
#
# `cost` i `latency` WYMAGAJĄ danych: przy ich ustawieniu każdy włączony model z tagami musi
# mieć odpowiednie pola w `config/models.yaml`, inaczej start się nie powiedzie. Zostawiamy
# `tags`, bo dostarczona konfiguracja nie zawiera zmierzonych wartości — a wpisanie
# zmyślonych byłoby gorsze niż ich brak.
strategy: tags

# Domyślny model per agent (nazwa agenta -> id modelu z registry, lub "auto").
agent_models:
  husarz: glm-main
  bielik: bielik
  kopijnik: hermes
  zwiadowca: hermes
  puszkarz: hermes
  kanclerz: glm-main
  chorazy: hermes

# Reguły: dopasuj po wymaganych tagach, preferuj wskazane modele (kolejność = priorytet).
rules:
  - match_tags: [polish]
    prefer: [bielik, glm-main]
  - match_tags: [code]
    prefer: [glm-main, hermes]
  - match_tags: [function-calling]
    prefer: [hermes, glm-main]
  - match_tags: [reasoning]
    prefer: [glm-main]

# Kontrola kosztów i limitów (twarde limity egzekwowane przez router w Etapie 1).
cost_controls:
  max_tokens_per_request: 8192
  max_requests_per_minute: 120

# Włącz łańcuchy fallback zdefiniowane w models.yaml.
fallbacks_enabled: true
