# shell — wykonywanie poleceń w sandboxie (Docker+gVisor), bez sieci.
# Tylko komendy z allowlisty, tylko w katalogu workspace.
name: shell
kind: shell
description: Uruchamianie dozwolonych poleceń w izolowanym sandboxie bez sieci.
enabled: true
requires_sandbox: true
requires_egress: false
# Allowlista poleceń (nazwa binarki). Puste = wszystko zablokowane.
allowlist:
  - python
  - pytest
  - ls
  - cat
  - grep
# UWAGA: to narzędzie NIE ma własnej sekcji `config`. Sieć, limity CPU/RAM/PID i timeout
# pochodzą WYŁĄCZNIE z `security.sandbox` — jedno źródło prawdy dla izolacji. Wcześniej stały
# tu klucze `network`, `cpu_limit`, `memory_limit`, `timeout_seconds`, których nikt nie czytał:
# ustawienie `network: false` wyglądało jak wyłączenie sieci, a realnie nie robiło nic.
config: {}
