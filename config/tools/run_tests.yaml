# run_tests — uruchamianie testów w sandboxie.
name: run_tests
kind: run_tests
description: Uruchamianie zestawu testów (pytest) w izolowanym sandboxie.
enabled: true
requires_egress: false
allowlist:
  - pytest
config:
  command: pytest -q
  # `workdir` → `platform.workspace_dir`; limit czasu i zasobów → `security.sandbox`
  # (dawne klucze `workdir`/`timeout_seconds` były w tym miejscu ignorowane).
