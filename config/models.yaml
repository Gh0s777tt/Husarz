# ============================================================================
# config/models.yaml — rejestr modeli (sekcja "models").
# ----------------------------------------------------------------------------
# Każdy model jest wymienny wyłącznie przez konfigurację (wymiana wag, fine-tune,
# LoRA, nowy endpoint) — bez zmian w kodzie. Wagi trzymane lokalnie (models/,
# gitignored). Endpointy to warstwa OpenAI-compat (vLLM/Ollama/SGLang).
#
# UWAGA: poniższe endpointy to lokalne placeholdery dla profilu dev. W profilu
# airgap muszą pozostać lokalne (loopback/LAN); egress i tak jest deny-all.
# ============================================================================

# Domyślny model orkiestracji (musi istnieć w registry).
default: glm-main
# Model trybu bezpośredniego czatu (/api/chat, „zwykły czat + kodowanie"). Wskazuje
# na lokalny, customowy model Husarza budowany z ollama/Husarz.Modelfile.
chat: husarz-local

registry:
  # --- Customowy model lokalny Husarza (czat + kodowanie), budowany w Ollamie ---
  # Zbuduj: `ollama create husarz -f ollama/Husarz.Modelfile` (patrz ollama/README.md).
  # Persona (hetman, PL, kod w blokach) jest zaszyta w Modelfile (SYSTEM).
  husarz-local:
    backend: ollama
    model: husarz # nazwa modelu w Ollamie po `ollama create husarz ...`
    endpoint: http://localhost:11434/v1
    tags: [chat, code, general, polish]
    context_length: 8192
    params:
      temperature: 0.3
    fallback: [bielik]

  # --- Model główny: GLM-5.2 (orkiestracja, rozumowanie, kod) ---
  glm-main:
    backend: openai_compat
    model: glm-5.2               # nazwa/repo przekazywana do backendu
    endpoint: http://localhost:8000/v1
    tags: [reasoning, code, orchestration, tools, general]
    context_length: 131072
    params:
      temperature: 0.3
    fallback: [hermes]

  # --- Model wizyjny (opcjonalny): obrazy w czacie ---
  # Wymaga modelu multimodalnego w Ollamie, np. `ollama pull llava` lub `qwen2-vl`.
  # Ustaw models.chat: husarz-vision, aby czat przyjmował zdjęcia.
  husarz-vision:
    backend: ollama
    model: llava # lub inny model wizyjny dostępny w Ollamie
    endpoint: http://localhost:11434/v1
    tags: [chat, vision, general]
    vision: true # zezwala na obrazy w /api/chat
    context_length: 8192
    params:
      temperature: 0.3
    fallback: [husarz-local]

  # --- Model polski: Bielik (język i zadania PL) ---
  #
  # UWAGA: tego modelu MUSISZ dostarczyć sam. Sprawdzone wprost odpytaniem rejestru
  # Ollamy (`registry.ollama.ai`): ani `bielik-11b-v3.0-instruct`, ani
  # `SpeakLeash/bielik-11b-v2.3-instruct` nie są tam dostępne, więc `ollama pull`
  # i `husarz bootstrap` nie mają skąd go wziąć. Wcześniejsza wersja tego pliku milczała
  # o tym, a `ollama/Husarz.Modelfile` sugerował jeszcze inną wersję — operator dostawał
  # dwie różne odpowiedzi i żadna nie działała.
  #
  # Do wyboru:
  #   * zaimportuj wagi GGUF do Ollamy (`ollama create bielik-... -f <Modelfile z FROM ...>`)
  #     i wpisz tu nazwę, którą nadałeś,
  #   * albo serwuj model przez vLLM i zmień `backend`/`endpoint` na ten serwer.
  #
  # Dopóki tego nie zrobisz, `husarz doctor` będzie zgłaszał brak tego modelu — i słusznie.
  bielik:
    backend: ollama
    model: bielik-11b-v3.0-instruct
    endpoint: http://localhost:11434/v1
    tags: [polish, general, chat]
    context_length: 32768
    params:
      temperature: 0.4
    fallback: [glm-main]

  # --- Silnik agentów: Hermes (NousResearch) — pętle narzędziowe, function-calling ---
  hermes:
    backend: vllm
    model: hermes-3
    endpoint: http://localhost:8001/v1
    tags: [tools, function-calling, agentic, research]
    context_length: 32768
    params:
      temperature: 0.2
    fallback: [glm-main]
