# ============================================================================
# .gitlab-ci.yml — CI Husarza na GitLabie (podstawowe zdalne repo).
# Lustro pipeline'u GitHub: lint + typy + testy, skan sekretów, SCA, build obrazu.
# Zielone CI to warunek scalenia (definicja „ukończone").
# ============================================================================
stages:
  - quality
  - security
  - build

default:
  image: python:3.13-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# --- Jakość: lint, format, typy, testy --------------------------------------
quality:
  stage: quality
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  image: "python:$PY-slim"
  script:
    - python -m pip install --upgrade pip
    # `docs` dla kroku `mkdocs build --strict` — MkDocs mieszka w extra `docs`, nie `dev`.
    - pip install -e ".[dev,docs]"
    - ruff check .
    # `scripts` dopisane w Etapie 18: CLAUDE.md wymienia trzy katalogi, CI sprawdzało dwa.
    - black --check src tests scripts
    - mypy
    - pytest -q
    # Bramka jakości Husarza (Etap 16) — weryfikatory deterministyczne, bez modelu i sieci.
    - python -m husarz.launcher.cli eval --config ./config --prompts ./prompts
    # Dokumentacja jako bramka: `--strict` wywraca się na martwym odnośniku, czyli na
    # rozjeździe dokumentacji z kodem. Kroku brakowało w obu pipeline'ach (Etap 18).
    - python -m mkdocs build --strict

# --- Skan sekretów ----------------------------------------------------------
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose

# --- SCA: znane podatności zależności ---------------------------------------
sca:
  stage: security
  script:
    - python -m pip install --upgrade pip
    - pip install -e .
    - pip install pip-audit
    - pip-audit --strict --progress-spinner off

# --- Build obrazu rdzenia (walidacja Dockerfile; bez push) ------------------
docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # Klient docker musi celować w usługę dind po TCP+TLS (inaczej brak /var/run/docker.sock).
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  script:
    - docker build -t husarz-api:ci .
